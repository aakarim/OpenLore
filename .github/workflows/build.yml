name: Build

on:
  push:
    branches: [main, release/v0.7.0]
  pull_request:
    branches: [main, release/v0.7.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Check, test, and build dashboard
        run: nix develop --command make dashboard-ci

      - name: Build
        run: nix develop --command go build ./...

      - name: Verify generated documentation
        run: |
          nix develop --command go generate ./docs/...
          git diff --exit-code docs/rules-stdlib.md

      - name: Test
        run: nix develop --command go test -race ${{ github.event_name == 'push' && '-short' || '' }} ./...

      - name: Test analytics S3 shipping and recovery
        if: github.event_name == 'pull_request'
        run: nix develop --command make test-analytics-s3

      - name: Test S3 filesystem and commit journal consistency
        if: github.event_name == 'pull_request'
        run: nix develop --command make test-filesystem-s3

      - name: Test separate SQLite databases with Litestream and S3
        if: github.event_name == 'pull_request'
        run: nix develop --command make test-litestream

  libghostty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test terminal rendering with libghostty
        run: nix develop --command make test-libghostty
