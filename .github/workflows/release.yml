name: Build & Release OpenLore

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/aakarim/openlore
  RAILPACK_FRONTEND: ghcr.io/railwayapp/railpack-frontend:v0.37.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify release source
        run: |
          test "$(cat assets/config/VERSION)" = "${GITHUB_REF_NAME#v}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Release source: $GITHUB_SHA"

      - name: Build dashboard assets
        run: nix develop --command make dashboard-build

      - name: Release binaries and Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: container-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish release container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: railpack-plan.json
          build-args: BUILDKIT_SYNTAX=${{ env.RAILPACK_FRONTEND }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
