name: Build & Release OpenLore

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/aakarim/openlore
  RAILPACK_FRONTEND: ghcr.io/railwayapp/railpack-frontend:v0.37.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify release source
        run: |
          test "$(cat assets/config/VERSION)" = "${GITHUB_REF_NAME#v}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .release
          echo "$GITHUB_SHA" > .release/source-sha.txt
          echo "Release source: $GITHUB_SHA"

      - name: Build dashboard assets
        run: nix develop --command make dashboard-build

      - name: Build release candidate without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Verify release candidate
        run: |
          (cd dist && sha256sum --check checksums.txt)

          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf dist/openlore_linux_amd64.tar.gz -C "$smoke_dir"
          test "$("$smoke_dir/openlore" version)" = "openlore ${GITHUB_REF_NAME#v}"

      - name: Release binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          test "$(cat .release/source-sha.txt)" = "$GITHUB_SHA"

          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf dist/openlore_linux_amd64.tar.gz -C "$smoke_dir"
          test "$("$smoke_dir/openlore" version)" = "openlore ${GITHUB_REF_NAME#v}"

          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Publish Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap aakarim/tap
          tap="$(brew --repository aakarim/tap)"
          cp dist/homebrew/Casks/lore.rb "$tap/Casks/lore.rb"
          brew style --fix --cask aakarim/tap/lore
          brew style --cask aakarim/tap/lore

          cd "$tap"
          git add Casks/lore.rb
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Brew cask update for lore version $GITHUB_REF_NAME"
          git push "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/aakarim/homebrew-tap.git" HEAD:main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: container-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish release container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: railpack-plan.json
          build-args: BUILDKIT_SYNTAX=${{ env.RAILPACK_FRONTEND }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
