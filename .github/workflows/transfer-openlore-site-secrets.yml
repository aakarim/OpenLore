name: Transfer openlore.sh deployment secrets

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets to lix-it/openlore.sh
        env:
          GH_TOKEN: ${{ secrets.SECRET_TRANSFER_GH_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          printf '%s' "$DEPLOY_SSH_KEY" | gh secret set DEPLOY_SSH_KEY --repo lix-it/openlore.sh
          printf '%s' "$DEPLOY_HOST" | gh secret set DEPLOY_HOST --repo lix-it/openlore.sh
          printf '%s' "$DEPLOY_USER" | gh secret set DEPLOY_USER --repo lix-it/openlore.sh
