primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "railpack-plan.json"

  [build.args]
    BUILDKIT_SYNTAX = "ghcr.io/railwayapp/railpack-frontend:v0.37.0"

[[mounts]]
  source = "openlore_data"
  destination = "/data"
  initial_size = "1GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 22

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
