version: 2

project_name: openlore

builds:
  - id: openlore
    main: ./cmd/openlore
    binary: openlore
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: openlore
    ids:
      - openlore
    name_template: "openlore_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: openlore
    ids:
      - openlore
    binaries:
      - openlore
    homepage: https://github.com/aakarim/OpenLore
    description: Agent-native knowledge base that keeps shared context current and inspectable
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/openlore"]
          end
    repository:
      owner: aakarim
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

release:
  github:
    owner: aakarim
    name: OpenLore
  draft: true
  extra_files:
    - glob: .release/source-sha.txt
