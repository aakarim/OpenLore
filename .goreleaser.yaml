version: 2

project_name: openlore

builds:
  - id: openlore
    main: ./cmd/openlore
    binary: openlore
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: openlore
    ids:
      - openlore
    name_template: "openlore_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: lore
    ids:
      - openlore
    binaries:
      - openlore
    homepage: https://github.com/aakarim/OpenLore
    description: Agent-native knowledge repository that keeps shared context current and inspectable
    # The release workflow publishes the cask after `brew style --fix` moves
    # this block into Homebrew's stanza order. GoReleaser `hooks` emit
    # `postflight`, which Homebrew's tap syntax check rejects.
    skip_upload: true
    # Strip macOS quarantine from the unsigned binary.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "openlore"], chdir: "."
        end
      end
    repository:
      owner: aakarim
      name: homebrew-tap

release:
  github:
    owner: aakarim
    name: OpenLore
  draft: true
  extra_files:
    - glob: .release/source-sha.txt
