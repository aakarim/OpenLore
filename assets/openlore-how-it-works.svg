<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How OpenLore works</title>
  <desc id="d">Claude Code, Codex and a CI job connect to one OpenLore server over MCP or SSH. OpenLore checks each identity's access and rules, then serves the same folder of Markdown files.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f7f6fb; stroke: #c9c3dd; stroke-width: 1.5; }
    .core { fill: #f1edfb; stroke: #6b4fd8; stroke-width: 2; }
    .files { fill: #fff6ef; stroke: #ff8a50; stroke-width: 1.5; }
    .title { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
    .label { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d1b26; }
    .small { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5c5870; }
    .mono { font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5c5870; }
    .line { stroke: #8f88a8; stroke-width: 1.5; fill: none; }
    .head { fill: #8f88a8; }
    .chip { fill: #ffffff; stroke: #c9c3dd; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3a3550; }
      .core { fill: #1d1833; stroke: #9d86ff; }
      .files { fill: #241a14; stroke: #ff8a50; }
      .title, .label { fill: #e8e6f0; }
      .small, .mono { fill: #a5a1b8; }
      .line { stroke: #6e6888; }
      .head { fill: #6e6888; }
      .chip { fill: #0d1117; stroke: #3a3550; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M10,0 L0,5 L10,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="340" rx="12"/>

  <!-- Agents -->
  <text class="small" x="40" y="44">Your agents</text>
  <rect class="box" x="40" y="58" width="190" height="62" rx="10"/>
  <text class="label" x="58" y="86">Claude Code</text>
  <text class="mono" x="58" y="106">MCP</text>

  <rect class="box" x="40" y="138" width="190" height="62" rx="10"/>
  <text class="label" x="58" y="166">Codex</text>
  <text class="mono" x="58" y="186">MCP</text>

  <rect class="box" x="40" y="218" width="190" height="62" rx="10"/>
  <text class="label" x="58" y="246">CI job or script</text>
  <text class="mono" x="58" y="266">SSH</text>

  <!-- Arrows agents to core -->
  <path class="line" d="M232,89 L248,89 C284,89 284,158 318,158" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path class="line" d="M232,169 L318,169" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <path class="line" d="M232,249 L248,249 C284,249 284,180 318,180" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>

  <!-- Core -->
  <rect class="core" x="320" y="58" width="220" height="222" rx="12"/>
  <text class="title" x="340" y="90">OpenLore</text>
  <text class="small" x="340" y="110">one server, many agents</text>

  <rect class="chip" x="340" y="128" width="180" height="36" rx="8"/>
  <text class="label" x="354" y="151">Who is this?</text>
  <rect class="chip" x="340" y="174" width="180" height="36" rx="8"/>
  <text class="label" x="354" y="197">What can they see?</text>
  <rect class="chip" x="340" y="220" width="180" height="36" rx="8"/>
  <text class="label" x="354" y="243">Does the write pass?</text>

  <!-- Arrow core to files -->
  <path class="line" d="M542,169 L618,169" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>

  <!-- Files -->
  <text class="small" x="620" y="44">Your knowledge</text>
  <rect class="files" x="620" y="58" width="160" height="222" rx="12"/>
  <text class="mono" x="638" y="90">docs/</text>
  <text class="mono" x="652" y="114">runbooks/</text>
  <text class="mono" x="652" y="138">decisions/</text>
  <text class="mono" x="652" y="162">skills/</text>
  <text class="mono" x="652" y="186">retries.md</text>
  <text class="small" x="638" y="236">Plain Markdown.</text>
  <text class="small" x="638" y="256">No vector database.</text>

  <!-- Caption -->
  <text class="small" x="40" y="316">Every agent reads the same files with cat, grep and find. Each one only sees what its identity is allowed to.</text>
</svg>
